{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="{% static 'temblor/css/styles.css' %}">
</head>
<body>
    <div class="card">
        <h2>FORMULARIO DE TEMBLOR</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>NOMBRE DEL TEMBLOR</label>
                <input type="text" name="nombre" required>
            </div>
            <div class="form-group">
                <label>MAGNITUD</label>
                <input type="number" step="any" name="magnitud" required>
            </div>
            <div class="form-group">
                <label>PROFUNDIDAD (KM)</label>
                <input type="number" step="any" name="profundidad" required>
            </div>
            <div class="form-group">
                <label>RANGO</label>
                <input type="number" name="rango" required>
            </div>
            <div class="form-group">
                <label>LUGAR</label>
                <input type="text" name="lugar" required>
            </div>
            <div class="form-group">
                <label>ÁREA</label>
                <input type="text" name="area" required>
            </div>
            <div class="form-group">
                <label>FECHA</label>
                <input type="date" name="fecha" required>
            </div>
            <div class="form-group">
                <label>HORA</label>
                <input type="time" name="hora" required>
            </div>
            <button type="submit" class="btn-primary">📫 Enviar y Ver Informe</button>
        </form>
    </div>
</body>
</html>
